      savePrefs(prefs) {

    const ExamLogic = {
      EVENT_META: {
        appStart: { label: "出願開始", icon: "🟢" },
        appEnd: { label: "出願締切", icon: "🚨" },
        feeDeadline: { label: "受験料振込期限", icon: "💴" },

      },
      parseLocalDate(dateStr) {
        if (!dateStr) return null;
        const [y, m, d] = dateStr.split("-").map(Number);
        return (!y || !m || !d) ? null : new Date(y, m - 1, d);
      },
      todayStr() {
        const n = new Date();

      },
      shortUniv(u) {

      },
      diffDaysFromToday(dateStr) {

        if (!target) return null;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      formatDateJa(dateStr) {

        if (!d) return "未設定";
        const weeks = ["日", "月", "火", "水", "木", "金", "土"];
        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${weeks[d.getDay()]}）`; }, getAllEvents(schools) { const events = []; schools.forEach((school) => { Object.keys(this.EVENT_META).forEach((key) => { const dateStr = school.dates?.[key]; if (!dateStr) return; if (key === "feeDeadline" && dateStr === school.dates?.appEnd) return; const meta = this.EVENT_META[key]; const extraNote = (key === "appEnd" && school.dates.appEndType) ? `（${school.dates.appEndType}）` : "";
            events.push({
              schoolId: school.id, university: school.university, faculty: school.faculty,

              typeLabel: (key === "appEnd" && school.dates?.feeDeadline === school.dates?.appEnd) ? "出願締切・受験料" : meta.label, icon: meta.icon, date: dateStr, extraNote,
              daysLeft: this.diffDaysFromToday(dateStr)
            });

        return events.sort((a, b) => a.date.localeCompare(b.date));

      findExamConflicts(schools) {
        const byDate = {};

          if (!byDate[d]) byDate[d] = [];
          byDate[d].push(s);

        return Object.entries(byDate).filter(([, list]) => list.length >= 2).map(([date, list]) => ({ date, schools: list })).sort((a, b) => a.date.localeCompare(b.date));
      },
      generateNotificationPreviews(schools) {
        const timings = [{ offsetDays: -7, label: "7日前" }, { offsetDays: -3, label: "3日前" }, { offsetDays: -1, label: "前日" }, { offsetDays: 0, label: "当日朝" }];
        const targetKeys = ["appEnd", "feeDeadline", "enrollmentDeadline"];

        schools.forEach((school) => {

              const remText = t.offsetDays === 0 ? "本日が締切です" : `まであと${Math.abs(t.offsetDays)}日`; list.push({ sendDate, timingLabel: t.label, school, typeLabel: meta.label, subject: `【${school.university} ${school.faculty}】${meta.label}${remText}`, body: `ももちゃん・お母様・おばあ様へ\n\n「${school.university} ${school.faculty}（${school.examType}）」の${meta.label}${remText}。\n\n■ 締切日：${this.formatDateJa(deadlineStr)}${methodNote}\n■ 募集要項リンク：${school.links?.guidelineUrl || "（未登録）"}\n■ 出願サイトリンク：${school.links?.applicationUrl || "（未登録）"}`

      openDayModal(ds) {
        const events = ExamLogic.getAllEvents(this.state.data.schools).filter((e) => e.date === ds);
        const dl = ExamLogic.diffDaysFromToday(ds);
        const dlText = dl === null ? "" : dl < 0 ? "終了しました" : dl === 0 ? "今日です" : `あと ${dl} 日`;
        const modal = document.getElementById("modalContent");
        modal.innerHTML = `
          <div class="modal-header">
            <div>
              <h2 style="margin:0; font-size:1.25rem;">📅 ${ExamLogic.formatDateJa(ds)}</h2>
              <div style="color:#4b5563; font-weight:700;">${dlText}</div>
            </div>
            <button type="button" class="btn btn-neutral" id="closeModalBtn">✕ 閉じる</button>
          </div>
          ${events.length ? events.map((ev) => `
            <div class="card ev-type-${ev.typeKey}" style="margin-bottom:12px;">
              <div style="font-size:1.15rem; font-weight:800;">${ev.icon} ${this.esc(ev.typeLabel)}${this.esc(ev.extraNote)}</div>
              <div style="margin-top:4px; font-weight:700;">${this.esc(ev.university)} ${this.esc(ev.faculty)}</div>
              <div style="font-size:0.9rem;">${this.esc(ev.examType)}</div>
              <button type="button" class="btn btn-primary btn-block" style="margin-top:10px;" data-day-open="${this.esc(ev.schoolId)}">📋 募集要項・手続きを見る</button>
            </div>`).join("") : `<p style="font-weight:700;">この日の予定はありません。</p>`}`;
        document.getElementById("modalBackdrop").classList.add("open");
        document.getElementById("closeModalBtn").addEventListener("click", () => this.closeModal());
        modal.querySelectorAll("[data-day-open]").forEach((btn) => btn.addEventListener("click", () => this.openDetailModal(btn.dataset.dayOpen)));
      },
      openDetailModal(id) {
        const s = this.state.data.schools.find(x => x.id === id);
        if (!s) return;
        const done = s.tasks.filter(t => t.done).length;
        const modal = document.getElementById("modalContent");
        modal.innerHTML = `
          <div class="modal-header">
            <div>
              <h2 style="margin:0; font-size:1.25rem;">${this.esc(s.university)}${this.esc(s.faculty)}</h2>
              <div style="color:#4b5563;">${this.esc(s.examType)}</div>
            </div>
            <button type="button" class="btn btn-neutral" id="closeModalBtn">✕ 閉じる</button>
          </div>
          ${this.linkGridHtml(s)}
          ${s.note ? `<div class="helper-text" style="margin:-6px 0 14px;">📝 ${this.esc(s.note)}</div>` : ""}
          <h3 style="margin:0 0 10px;">✅ 手続きチェックリスト（${done}/${s.tasks.length} 完了）</h3>
          ${s.tasks.map(t => `
            <div class="task-row ${t.done ? "done" : ""}">
              <input type="checkbox" class="task-checkbox" data-toggle-task="${this.esc(t.id)}" ${t.done ? "checked" : ""} />
              <span class="task-title">${this.esc(t.title)}</span>
              <button type="button" class="btn btn-danger" style="min-height:40px; padding:6px 10px;" data-del-task="${this.esc(t.id)}">削除</button>
            </div>`).join("")}
          <div style="display:flex; gap:8px; margin-top:12px;">
            <input type="text" id="newTaskInput" class="form-control" placeholder="新しい手続きを追加" />
            <button type="button" class="btn btn-primary" id="addTaskBtn">＋ 追加</button>
          </div>
          <div style="display:flex; gap:8px; margin-top:18px;">
            <button type="button" class="btn btn-outline" style="flex:1;" id="modalEditBtn">✏️ 日程・URLを編集</button>
            <button type="button" class="btn btn-danger" id="modalDelBtn">🗑️ 削除</button>
          </div>`;
        document.getElementById("modalBackdrop").classList.add("open");
        document.getElementById("closeModalBtn").addEventListener("click", () => this.closeModal());
        document.querySelectorAll("[data-toggle-task]").forEach(cb => cb.addEventListener("change", () => {
          const t = s.tasks.find(x => x.id === cb.dataset.toggleTask);
          if (t) { t.done = cb.checked; StorageRepository.saveData(this.state.data); this.openDetailModal(s.id); this.render(); }
        }));
        document.getElementById("addTaskBtn").addEventListener("click", () => {
          const val = document.getElementById("newTaskInput").value.trim();
          if (!val) return;
          s.tasks.push({ id: "t_" + Date.now(), title: val, done: false });
          StorageRepository.saveData(this.state.data);
          this.openDetailModal(s.id);
          this.render();
        });
        document.querySelectorAll("[data-del-task]").forEach(btn => btn.addEventListener("click", () => {
          s.tasks = s.tasks.filter(x => x.id !== btn.dataset.delTask);
          StorageRepository.saveData(this.state.data);
          this.openDetailModal(s.id);
          this.render();
        }));
        document.getElementById("modalEditBtn").addEventListener("click", () => this.openFormModal(s.id));
        document.getElementById("modalDelBtn").addEventListener("click", () => {
          if (!confirm(`「${s.university}${s.faculty}」を削除しますか？`)) return;
          this.state.data.schools = this.state.data.schools.filter(x => x.id !== s.id);
          StorageRepository.saveData(this.state.data);
          this.closeModal();
          this.render();
        });
      },
      openFormModal(id = null) {
        const isEdit = Boolean(id);
        const s = isEdit ? this.state.data.schools.find(x => x.id === id) : {
          id: "school_" + Date.now(), university: "", faculty: "", examType: "一般選抜", priority: "併願",
          dates: { appStart: "", appEnd: "", appEndType: "消印有効", feeDeadline: "", examDate: "", resultDate: "", enrollmentDeadline: "" },
          links: { guidelineUrl: "", applicationUrl: "", scheduleUrl: "", lastChecked: "2026-11-24" },
          tasks: [{ id: "t_" + Date.now(), title: "高校へ調査書の発行を依頼する", done: false }]
        };
        const modal = document.getElementById("modalContent");
        modal.innerHTML = `
          <div class="modal-header">
            <h2 style="margin:0;">${isEdit ? "✏️ 志望校の編集" : "＋ 志望校の追加"}</h2>
            <button type="button" class="btn btn-neutral" id="closeModalBtn">✕ 閉じる</button>
          </div>
          <form id="schoolForm">
            <div class="form-row-2">
              <div class="form-group"><label class="form-label">大学名</label><input type="text" id="f_u" class="form-control" required value="${this.esc(s.university)}" /></div>
              <div class="form-group"><label class="form-label">学部・学科</label><input type="text" id="f_f" class="form-control" required value="${this.esc(s.faculty)}" /></div>
            </div>
            <div class="form-row-2">
              <div class="form-group"><label class="form-label">入試方式</label><input type="text" id="f_e" class="form-control" value="${this.esc(s.examType)}" /></div>
              <div class="form-group"><label class="form-label">志望度</label>
                <select id="f_p" class="form-control">
                  ${["第一志望", "併願", "検討中"].map(p => `<option value="${p}" ${s.priority === p ? "selected" : ""}>${p}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-group"><label class="form-label">出願締切</label><input type="date" id="f_ae" class="form-control" value="${this.esc(s.dates?.appEnd || "")}" /></div>
              <div class="form-group"><label class="form-label">締切扱い</label>
                <select id="f_aet" class="form-control">
                  <option value="消印有効" ${s.dates?.appEndType === "消印有効" ? "selected" : ""}>消印有効</option>
                  <option value="必着" ${s.dates?.appEndType === "必着" ? "selected" : ""}>必着</option>
                </select>
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-group"><label class="form-label">試験日</label><input type="date" id="f_ex" class="form-control" value="${this.esc(s.dates?.examDate || "")}" /></div>
              <div class="form-group"><label class="form-label">合格発表日</label><input type="date" id="f_rs" class="form-control" value="${this.esc(s.dates?.resultDate || "")}" /></div>
            </div>
            <div class="form-row-2">
              <div class="form-group"><label class="form-label">受験料の振込期限</label><input type="date" id="f_fee" class="form-control" value="${this.esc(s.dates?.feeDeadline || "")}" /></div>
              <div class="form-group"><label class="form-label">入学手続き締切</label><input type="date" id="f_en" class="form-control" value="${this.esc(s.dates?.enrollmentDeadline || "")}" /></div>
            </div>
            <div class="form-group">
              <label class="form-label">出願開始日（分かれば）</label>
              <input type="date" id="f_as" class="form-control" value="${this.esc(s.dates?.appStart || "")}" />
            </div>
            <div class="form-group">
              <label class="form-label">📖 募集要項のURL</label>
              <input type="url" id="f_gu" class="form-control" placeholder="https://" value="${this.esc(s.links?.guidelineUrl || "")}" />
            </div>
            <div class="form-group">
              <label class="form-label">💻 出願サイトのURL</label>
              <input type="url" id="f_au" class="form-control" placeholder="https://" value="${this.esc(s.links?.applicationUrl || "")}" />
            </div>
            <div class="form-group">
              <label class="form-label">📅 入試日程ページのURL</label>
              <input type="url" id="f_su" class="form-control" placeholder="https://" value="${this.esc(s.links?.scheduleUrl || "")}" />
            </div>
            <div class="form-group">
              <label class="form-label">リンクを最後に確認した日</label>
              <input type="date" id="f_lc" class="form-control" value="${this.esc(s.links?.lastChecked || "")}" />
              <div class="helper-text">年度の古い募集要項を見ないよう、確認した日を残しておきます。</div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">💾 保存する</button>
          </form>`;
        document.getElementById("modalBackdrop").classList.add("open");
        document.getElementById("closeModalBtn").addEventListener("click", () => this.closeModal());
        document.getElementById("schoolForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const v = (fieldId) => document.getElementById(fieldId).value.trim();
          s.university = v("f_u");
          s.faculty = v("f_f");
          s.examType = v("f_e");
          s.priority = document.getElementById("f_p").value;
          s.dates = {
            appStart: v("f_as"),
            appEnd: v("f_ae"),
            appEndType: document.getElementById("f_aet").value,
            feeDeadline: v("f_fee"),
            examDate: v("f_ex"),
            resultDate: v("f_rs"),
            enrollmentDeadline: v("f_en")
          };
          s.links = {
            guidelineUrl: v("f_gu"),
            applicationUrl: v("f_au"),
            scheduleUrl: v("f_su"),
            lastChecked: v("f_lc")
          };
          if (!isEdit) this.state.data.schools.push(s);
          StorageRepository.saveData(this.state.data);
          this.closeModal();
          this.render();
        });
      },
      closeModal() {
        document.getElementById("modalBackdrop").classList.remove("open");
        document.getElementById("modalContent").innerHTML = "";
      },
      bindEvents() {
        const main = document.getElementById("appMain");
        main.querySelectorAll("[data-open]").forEach((el) => {
          el.addEventListener("click", () => this.openDetailModal(el.dataset.open));
        });
        main.querySelectorAll("[data-edit]").forEach((el) => {
          el.addEventListener("click", () => this.openFormModal(el.dataset.edit));
        });
        const addBtn = document.getElementById("addSchoolBtn");
        if (addBtn) addBtn.addEventListener("click", () => this.openFormModal());
        main.querySelectorAll("[data-cal-mode]").forEach((el) => {
          el.addEventListener("click", () => {
            this.state.calendarMode = el.dataset.calMode;
            this.render();
          });
        });
        const prev = document.getElementById("prevMonthBtn");
        const next = document.getElementById("nextMonthBtn");
        if (prev) prev.addEventListener("click", () => {
          const c = this.state.calendarMonth;
          this.state.calendarMonth = new Date(c.getFullYear(), c.getMonth() - 1, 1);
          this.render();
        });
        if (next) next.addEventListener("click", () => {
          const c = this.state.calendarMonth;
          this.state.calendarMonth = new Date(c.getFullYear(), c.getMonth() + 1, 1);
          this.render();
        });
        main.querySelectorAll("[data-day]").forEach((el) => {
          el.addEventListener("click", () => this.openDayModal(el.dataset.day));
        });
        const todayBtn = document.getElementById("todayMonthBtn");
        if (todayBtn) todayBtn.addEventListener("click", () => {
          const n = new Date();
          this.state.calendarMonth = new Date(n.getFullYear(), n.getMonth(), 1);
          this.render();
        });
        const swipe = document.getElementById("calSwipe");
        if (swipe) {
          let startX = null;
          swipe.addEventListener("touchstart", (e) => { startX = e.changedTouches[0].clientX; }, { passive: true });
          swipe.addEventListener("touchend", (e) => {
            if (startX === null) return;
            const dx = e.changedTouches[0].clientX - startX;
            startX = null;
            if (Math.abs(dx) > 60) this.shiftMonth(dx < 0 ? 1 : -1);
          });
        }
        const fontBtn = document.getElementById("settingsFontBtn");
        if (fontBtn) fontBtn.addEventListener("click", () => {
          this.state.prefs.largeText = !this.state.prefs.largeText;
          StorageRepository.savePrefs(this.state.prefs);
          this.applyFont();
          this.render();
        });
        const exportBtn = document.getElementById("exportJsonBtn");
        if (exportBtn) exportBtn.addEventListener("click", () => {
          const blob = new Blob([JSON.stringify(this.state.data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "momo-exam-data.json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        });
        const importInput = document.getElementById("importJsonInput");
        if (importInput) importInput.addEventListener("change", () => {
          const file = importInput.files && importInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!parsed || !Array.isArray(parsed.schools)) throw new Error("形式が違います");
              if (!confirm("今のデータを、読み込んだデータで置き換えます。よろしいですか？")) return;
              this.state.data = parsed;
              StorageRepository.saveData(this.state.data);
              this.render();
              alert("読み込みました。");
            } catch (err) {
              alert("このファイルは読み込めませんでした。書き出したJSONファイルを選んでください。");
            }
          };
          reader.readAsText(file);
        });
      }
    };

    App.init();
  </script>
</body>
</html>
